; ============================================================================
; The Weather Channel - Local Forecast (clone anos 80)
; M5Stack Core2 + módulo RCA (M125) — vídeo composto NTSC + áudio I2S em loop.
;
; Projeto SEPARADO e autocontido. Compile/grave a partir da raiz do repo:
;   .venv/bin/pio run -d weather --target upload
; ============================================================================

[env:weather]
platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified@0.2.10
    m5stack/M5GFX@0.2.29
    bblanchon/ArduinoJson@7.4.2