; ============================================================================
; The Weather Channel - Local Forecast (clone anos 80)
; Adafruit Fruit Jam (RP2350B) — DVI 640x480 (quadro de 320x240 dobrado) +
; música de fundo em loop pelo TLV320DAC3100.
;
; Projeto SEPARADO. Compile/grave a partir da raiz do repo:
;   .venv/bin/pio run -d weather --target upload
;
; O código de APLICAÇÃO (WAV, parse do tempo, ticker) continua duplicado de
; propósito em src/main.cpp (AGENTS.md §1). A camada de PLATAFORMA do Fruit Jam
; (include/fj/*.h + src/fj/*.cpp da raiz) NÃO é duplicada: é compilada daqui
; mesmo, com dois ajustes:
;
;   include_dir = ../include         acha "fj/Display.h" e companhia;
;   +<../../src/fj/> no filtro       compila os .cpp da plataforma.
;
; include_dir, e não um -I nos build_flags, porque o LDF não segue includes
; por caminhos de -I: com -I ele não via que fj/Gfx.h puxa o LovyanGFX nem que
; fj/Net.h puxa o WiFiNINA. Os demais headers da raiz ficam visíveis também,
; mas a previsão não inclui nenhum deles.
;
; Filtro de fontes, e não um extra_script com env.BuildSources(), porque o LDF
; do PlatformIO só varre os arquivos que o filtro enxerga. É assim que ele
; descobre que o Display.cpp usa o Adafruit-DVI-HSTX (que nenhum header puxa) e
; o AudioOut.cpp usa o TLV320 — o que importa quando o platformio_local.ini
; esvazia o lib_deps e as bibliotecas vêm só do lib_extra_dirs.
; Efeito colateral inofensivo: os objetos desses .cpp caem em .pio/build/src/fj,
; um nível acima da pasta do ambiente (o PlatformIO junta o caminho relativo ao
; diretório de variante sem normalizar).
; ============================================================================

[platformio]
default_envs = fruitjam
; Sobreposição local opcional (ignorada pelo git), para compilar sem acesso ao
; registro do PlatformIO. Ver PORTING.md §4. O ambiente se chama "fruitjam",
; como o da raiz, para que o mesmo modelo de platformio_local.ini sirva aos dois.
extra_configs = platformio_local*.ini
include_dir = ../include

[env:fruitjam]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_fruitjam
framework = arduino
board_build.core = earlephilhower
; O DVHSTX sobe o relógio para 240 MHz sozinho e recusa compilar com outro
; valor aqui (ver o platformio.ini da raiz).
board_build.f_cpu = 150000000L
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
    -DFRUITJAM_RETRO_TV
build_src_filter =
    +<*>
    +<../../src/fj/>
    -<../../src/fj/UsbHost.cpp>
; UsbHost.cpp fora: exige -DUSE_TINYUSB e a lib Pico-PIO-USB (nenhum dos dois
; está aqui, de propósito -- a previsão não navega por teclado/gamepad, e
; puxar o TinyUSB inteiro só para isto não vale o peso). Se um dia o weather/
; ganhar controle USB, declare os dois aqui e tire esta linha.
; Mesmas revisões da raiz, só as que a previsão usa (sem JPEGDEC nem Helix).
; Adafruit-GFX e BusIO entram porque o Adafruit-DVI-HSTX depende deles.
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#3527e99d4635bd3ddce7c5c312e98f6e613f93ab
    https://github.com/adafruit/Adafruit-DVI-HSTX.git#abff804996384d372b30bb7a16c940d2b5832e99
    https://github.com/adafruit/Adafruit-GFX-Library.git#ac6d7c3869a693d406f77b9bfcd486b0673169f0
    https://github.com/adafruit/Adafruit_BusIO.git#3b8364267c3ee6e16bad91bc2101aefbd5b5915f
    https://github.com/adafruit/WiFiNINA.git#1e0c3503dbdaec40bf125cb2835928d82bb9cab8
    https://github.com/adafruit/Adafruit_TLV320_I2S.git#a361dbc4f1168fd37c98329a600e7daffe658434
    https://github.com/bblanchon/ArduinoJson.git#733bc4ee82630c88c0a619a883cd3a206efae977
