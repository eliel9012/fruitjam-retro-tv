; Fruit Jam Retro TV — fork do m5-retro-tv para o Adafruit Fruit Jam (RP2350B).
;
; Core Arduino do Earle Philhower (arduino-pico) pela plataforma comunitária do
; Max Gerhardt: a plataforma oficial "raspberrypi" do PlatformIO não tem RP2350.
;
; O DVHSTX sobe o relógio do sistema sozinho (240 MHz num preinit antes do
; setup(), depois o valor exato que o modo de vídeo pede -- 126 MHz para
; 640x480@60, conferido em dvhstx.cpp/dvi.cpp, não 264 nem 240 como versões
; antigas deste comentário diziam); por isso f_cpu fica em 150 MHz aqui (a
; biblioteca recusa compilar com outro valor).
;
; USE_TINYUSB troca o Serial/CDC nativo (que continua sendo a USB-C de
; gravação) para a pilha Adafruit_TinyUSB, e é o que faz o
; tusb_config_rp2040.h do framework habilitar o host por PIO-USB junto (ver
; include/fj/UsbHost.h). NÃO usar "USE_TINYUSB_HOST": essa variante vira o
; controlador NATIVO em host e mata o Serial de diagnóstico.
[platformio]
default_envs = fruitjam
; Sobreposição local opcional (ignorada pelo git), para compilar sem acesso ao
; registro do PlatformIO. Ver PORTING.md.
extra_configs = platformio_local*.ini

[env:fruitjam]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_fruitjam
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 150000000L
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
    -DFRUITJAM_RETRO_TV
    -DUSE_TINYUSB
; Fixadas por commit: o firmware foi validado contra estas revisões.
; Adafruit_TinyUSB_Arduino já vem dentro do framework-arduinopico
; (libraries/Adafruit_TinyUSB_Arduino) e não precisa de lib_deps; só o
; Pico-PIO-USB (não é do arduino-pico) vem daqui.
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#3527e99d4635bd3ddce7c5c312e98f6e613f93ab
    https://github.com/adafruit/Adafruit-DVI-HSTX.git#abff804996384d372b30bb7a16c940d2b5832e99
    https://github.com/adafruit/Adafruit-GFX-Library.git#ac6d7c3869a693d406f77b9bfcd486b0673169f0
    https://github.com/adafruit/Adafruit_BusIO.git#3b8364267c3ee6e16bad91bc2101aefbd5b5915f
    https://github.com/adafruit/WiFiNINA.git#1e0c3503dbdaec40bf125cb2835928d82bb9cab8
    https://github.com/adafruit/Adafruit_TLV320_I2S.git#a361dbc4f1168fd37c98329a600e7daffe658434
    https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
    https://github.com/bblanchon/ArduinoJson.git#733bc4ee82630c88c0a619a883cd3a206efae977
    https://github.com/pschatzmann/arduino-libhelix.git#5c0a04302dbd661a56408eeb1756e01dd8d33ba1
    https://github.com/sekigon-gonnoc/Pico-PIO-USB.git#5a37a66dc5d3fbe0ef3cdbeda923a757440f984f
