; Fruit Jam Retro TV — fork do m5-retro-tv para o Adafruit Fruit Jam (RP2350B).
;
; Core Arduino do Earle Philhower (arduino-pico) pela plataforma comunitária do
; Max Gerhardt: a plataforma oficial "raspberrypi" do PlatformIO não tem RP2350.
;
; O DVHSTX sobe o relógio do sistema para 240 MHz sozinho; por isso f_cpu fica
; em 150 MHz aqui (a biblioteca recusa compilar com outro valor).
[platformio]
default_envs = fruitjam
; Sobreposição local opcional (ignorada pelo git), para compilar sem acesso ao
; registro do PlatformIO. Ver PORTING.md.
extra_configs = platformio_local*.ini

[env:fruitjam]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_fruitjam
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 150000000L
monitor_speed = 115200
lib_ldf_mode = chain+
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
    -DFRUITJAM_RETRO_TV
; Fixadas por commit: o firmware foi validado contra estas revisões.
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#3527e99d4635bd3ddce7c5c312e98f6e613f93ab
    https://github.com/adafruit/Adafruit-DVI-HSTX.git#abff804996384d372b30bb7a16c940d2b5832e99
    https://github.com/adafruit/Adafruit-GFX-Library.git#ac6d7c3869a693d406f77b9bfcd486b0673169f0
    https://github.com/adafruit/Adafruit_BusIO.git#3b8364267c3ee6e16bad91bc2101aefbd5b5915f
    https://github.com/adafruit/WiFiNINA.git#1e0c3503dbdaec40bf125cb2835928d82bb9cab8
    https://github.com/adafruit/Adafruit_TLV320_I2S.git#a361dbc4f1168fd37c98329a600e7daffe658434
    https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
    https://github.com/bblanchon/ArduinoJson.git#733bc4ee82630c88c0a619a883cd3a206efae977
    https://github.com/pschatzmann/arduino-libhelix.git#5c0a04302dbd661a56408eeb1756e01dd8d33ba1

; fruitjam-launcher — mesmo firmware, mas relinkado para rodar na região fixa
; que o fork fruitjam-retro-tv do pico-bootLoader reserva no topo da flash
; (0x10C00000..0x11000000, 4 MB) em vez de 0x10000000. Ver PORTING.md, seção
; "Emuladores": o lançador é quem chega primeiro a 0x10000000 de verdade (o
; bootrom sempre boota o que está lá) e salta para cá por VTOR depois de
; validar a imagem — por isso ela não precisa de um IMAGE_DEF válido para
; rodar, só de ORIGIN/LENGTH corretos no linker script para que o
; drag-and-drop do BOOTSEL grave nos endereços certos.
;
; extends copia todo o env fruitjam (lib_deps, build_flags, etc.) e só
; sobrescreve o que muda de fato: o linker script (board_build.ldscript,
; que faz o gerador padrão do arduino-pico ser pulado inteiro — ver
; boards/fruitjam_launcher_memmap.ld), o teto de tamanho reportado pelo
; PlatformIO (board_upload.maximum_size, só cosmético: o próprio linker
; script já é quem impede o link de passar de 4 MB), a definição que o
; código lê para saber que EMULADORES é de verdade um botão, não uma tela
; explicando que falta o lançador (ver UiLogic.h / main.cpp), e um
; extra_scripts que reconverte o .uf2 com --family/--platform explícitos
; (ver tools/pio_fruitjam_launcher_uf2.py — sem isso o picotool >= 2.2
; deduz a plataforma errada para uma imagem que não começa em 0x10000000
; e recusa o segmento de RAM).
[env:fruitjam-launcher]
extends = env:fruitjam
board_build.ldscript = boards/fruitjam_launcher_memmap.ld
board_upload.maximum_size = 4194304
extra_scripts =
    post:tools/pio_fruitjam_launcher_uf2.py
build_flags =
    ${env:fruitjam.build_flags}
    -DFRUITJAM_LAUNCHER_BUILD
